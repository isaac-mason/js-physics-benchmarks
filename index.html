<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>js-physics-benchmarks</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="topbar">
      <div class="topbar-left">
        <a class="brand-mark" href="https://github.com/isaac-mason/js-physics-benchmarks" target="_blank" rel="noopener">js-physics-benchmarks</a>
        <div class="menu" id="engine-menu">
          <button class="menu-trigger" id="engine-trigger" type="button" aria-haspopup="true" aria-expanded="false">
            <span class="menu-value" id="engine-current"></span>
            <span class="menu-caret">▾</span>
          </button>
          <div class="menu-panel" id="engine-panel" hidden></div>
        </div>
        <div class="menu" id="scenario-menu">
          <button class="menu-trigger" id="scenario-trigger" type="button" aria-haspopup="true" aria-expanded="false">
            <span class="menu-value" id="scenario-current"></span>
            <span class="menu-caret">▾</span>
          </button>
          <div class="menu-panel" id="scenario-panel" hidden></div>
        </div>
      </div>
    </div>

    <div id="top-right-panel">
      <div id="stats-container"></div>
      <div id="scenario-gui"></div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
